<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ByteSumCookies · 새 버전으로 전환</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:white;color:#242424;font:15px/1.75 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding:24px}
main{max-width:580px;width:100%}h1{font-size:26px;letter-spacing:-.04em}p{color:#666}small{color:#999}button{border:1px solid #222;background:#222;color:#fff;padding:12px 18px;cursor:pointer;font:inherit}#status{min-height:36px;color:#444}
</style>
</head>
<body>
<main><p style="letter-spacing:.14em;font-weight:700;font-size:11px">BYTESUMCOOKIES / SITE REFRESH</p>
<h1>최신 블로그로 전환 중입니다.</h1>
<p>예전 Chirpy 오프라인 캐시와 서비스 워커를 정리하고 새 페이지를 불러옵니다. 블로그 게시글이나 GitHub 파일은 삭제되지 않습니다.</p>
<p id="status" role="status" aria-live="polite">사이트 캐시를 확인하는 중…</p>
<button id="retry" type="button" hidden>다시 실행</button>
<small>자동으로 이동하지 않을 경우 새로고침을 누르거나 버튼을 눌러주세요.</small>
</main>
<script>
(async function cleanSiteCache(){
 const status=document.getElementById('status');
 const retry=document.getElementById('retry');
 try {
   status.textContent='기존 서비스 워커 해제 중…';
   if('serviceWorker' in navigator){
     const registrations=await navigator.serviceWorker.getRegistrations();
     await Promise.all(registrations.map(r=>r.unregister()));
   }
   status.textContent='저장된 페이지 캐시 정리 중…';
   if('caches' in window){
     const names=await caches.keys();
     await Promise.all(names.map(name=>caches.delete(name)));
   }
   status.textContent='최신 홈페이지를 불러옵니다…';
   location.replace('/?bsc-refresh='+Date.now());
 }catch(error){
   status.textContent='자동 정리에 실패했습니다. 다시 실행하거나 시크릿 창에서 확인해 주세요.';
   retry.hidden=false;
   retry.addEventListener('click',()=>location.reload());
 }
})();
</script></body>
</html>
