# ByteSumCookies — standalone Jekyll site (no Chirpy theme)
title: ByteSumCookies
description: "네트워크, 정보보안, 클라우드 학습 기록과 프로젝트 아카이브."
lang: ko-KR
timezone: Asia/Seoul
url: "https://bysumcookies.github.io"
baseurl: ""
social_preview_image: /assets/img/brand/og-image.png

# Independent Jekyll SEO features; no Chirpy dependency.
plugins:
  - jekyll-feed
  - jekyll-sitemap

feed:
  posts_limit: 20
  excerpt_only: true
  icon: /favicon-32.png

markdown: kramdown
highlighter: rouge
permalink: /posts/:title/
kramdown:
  input: GFM
  syntax_highlighter: rouge

collections:
  tabs:
    output: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: bsc-post
  - scope:
      path: ""
      type: tabs
    values:
      layout: bsc

exclude:
  - README.md
  - LICENSE
  - tools
  - scripts
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
